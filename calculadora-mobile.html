<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Calculadora</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🧮</text></svg>'>
<style>
  :root{
    --bg-page:#08080d;
    --bg-phone-a:#17171f;
    --bg-phone-b:#0c0c13;
    --key-num:#23232f;
    --key-num-hover:#2e2e3c;
    --key-fn:#2c2c3a;
    --key-text:#f2f2f8;
    --key-fn-text:#cfd0e0;
    --accent-a:#ffb03a;
    --accent-b:#ff7a1a;
    --display:#f5f5fa;
    --dim:#9a9ab3;
    --dimmer:#6f6f89;
    --danger:#ff8f7a;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(1100px 700px at 75% -10%, #1d1530 0%, transparent 60%),
      radial-gradient(900px 600px at -10% 110%, #101a2e 0%, transparent 55%),
      var(--bg-page);
    color:var(--key-text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:28px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .stage{ display:flex; flex-direction:column; align-items:center; gap:16px; }

  /* ---------- Moldura do telefone ---------- */
  .phone{
    position:relative;
    width:min(400px, 100vw);
    height:min(840px, calc(100dvh - 90px));
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border-radius:44px;
    border:1px solid rgba(255,255,255,.09);
    background:linear-gradient(165deg, var(--bg-phone-a) 0%, var(--bg-phone-b) 100%);
    box-shadow:
      0 40px 90px rgba(0,0,0,.65),
      0 12px 28px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ---------- Barra de status ---------- */
  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top, 0px)) 26px 6px;
    font-size:.82rem; font-weight:600; color:#c9c9dd;
    letter-spacing:.4px;
    user-select:none;
  }
  .status-icons{ display:flex; align-items:center; gap:7px; }
  .status-icons svg{ display:block; }

  /* ---------- Visor ---------- */
  .display{
    flex:1;
    min-height:180px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    gap:8px;
    padding:8px 24px 14px;
  }
  .display-top{
    display:flex; align-items:center; gap:10px;
    min-height:36px;
  }
  .icon-btn{
    width:36px; height:36px; flex:0 0 36px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.06);
    color:#c9c9dd;
    display:grid; place-items:center;
    cursor:pointer;
    transition:background .15s ease, transform .09s ease;
  }
  .icon-btn:hover{ background:rgba(255,255,255,.12); }
  .icon-btn:active{ transform:scale(.9); }
  .expr-wrap{
    flex:1;
    overflow:hidden;
    text-align:right;
    white-space:nowrap;
    font-size:1.02rem;
    color:var(--dim);
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 16%);
    mask-image:linear-gradient(90deg, transparent 0, #000 16%);
  }
  #expr .preview{ color:var(--dimmer); font-size:.95em; }
  .display-main{
    text-align:right;
    font-size:clamp(2.5rem, 11vw, 3.35rem);
    font-weight:300;
    line-height:1.12;
    letter-spacing:.5px;
    font-variant-numeric:tabular-nums;
    word-break:break-all;
    transition:font-size .1s ease;
  }
  .display-main.error{
    font-size:1.45rem !important;
    font-weight:500;
    color:var(--danger);
    line-height:1.3;
  }

  /* ---------- Teclado ---------- */
  .keys{
    flex:1.35;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-template-rows:repeat(5, 1fr);
    gap:10px;
    padding:12px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    min-height:330px;
  }
  .key{
    border:none;
    border-radius:22px;
    background:var(--key-num);
    color:var(--key-text);
    font-family:inherit;
    font-size:1.3rem;
    font-weight:500;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.05),
      0 5px 12px rgba(0,0,0,.28);
    transition:transform .09s ease, filter .09s ease, background .15s ease;
  }
  .key.num:hover{ background:var(--key-num-hover); }
  .key.fn{
    background:var(--key-fn);
    color:var(--key-fn-text);
    font-size:1.35rem;
  }
  .key.fn:hover{ filter:brightness(1.18); }
  .key.clear{ color:var(--danger); font-weight:600; }
  .key.op{
    background:linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color:#241303;
    font-size:1.7rem;
    font-weight:600;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      0 8px 18px rgba(255,138,26,.30);
  }
  .key.op:hover{ filter:brightness(1.1); }
  .key.eq{
    background:linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color:#241303;
    font-size:1.7rem;
    font-weight:700;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.4),
      0 10px 24px rgba(255,138,26,.42);
  }
  .key.eq:hover{ filter:brightness(1.1); }
  .key:active, .key.pressed{
    transform:scale(.93);
    filter:brightness(1.22);
  }
  .key:focus-visible, .icon-btn:focus-visible{
    outline:2px solid var(--accent-a);
    outline-offset:2px;
  }

  /* ---------- Painel de histórico ---------- */
  .history-panel{
    position:absolute;
    inset:0;
    background:rgba(12,12,19,.88);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    display:flex;
    flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top, 0px)) 20px calc(18px + env(safe-area-inset-bottom, 0px));
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:5;
  }
  .history-panel.open{ opacity:1; transform:none; pointer-events:auto; }
  .history-head{
    display:flex; align-items:center; gap:8px;
    padding-bottom:12px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .history-head h2{
    flex:1;
    font-size:1.05rem;
    font-weight:600;
    color:#e6e6f0;
    letter-spacing:.3px;
  }
  .history-list{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    padding:4px 0;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.15) transparent;
  }
  .h-item{
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(255,255,255,.06);
    text-align:right;
    padding:13px 8px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:3px;
    font-family:inherit;
    color:inherit;
    transition:background .12s ease;
  }
  .h-item:hover{ background:rgba(255,255,255,.05); }
  .h-item:active{ background:rgba(255,255,255,.09); }
  .h-expr{ color:#8f8fa8; font-size:.92rem; }
  .h-res{ color:#fff; font-size:1.42rem; font-weight:500; font-variant-numeric:tabular-nums; }
  .h-empty{
    margin:auto;
    color:#8f8fa8;
    text-align:center;
    line-height:1.7;
    font-size:.98rem;
  }

  /* ---------- Dica de teclado (desktop) ---------- */
  .hint{
    color:#5c5c74;
    font-size:.82rem;
    text-align:center;
    line-height:1.6;
    user-select:none;
  }
  .hint kbd{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:6px;
    padding:1px 6px;
    font-family:inherit;
    font-size:.78rem;
    color:#9a9ab3;
  }

  /* ---------- Tela cheia no celular ---------- */
  @media (max-width:480px){
    body{ padding:0; }
    .stage{ gap:0; width:100%; height:100dvh; }
    .phone{
      width:100vw;
      height:100dvh;
      border-radius:0;
      border:none;
      box-shadow:none;
    }
    .hint{ display:none; }
  }
  @media (max-height:760px) and (min-width:481px){
    .phone{ height:min(840px, calc(100dvh - 70px)); border-radius:32px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <main class="phone" aria-label="Calculadora">

      <!-- Barra de status simulada -->
      <div class="statusbar" aria-hidden="true">
        <span id="clock">--:--</span>
        <span class="status-icons">
          <!-- sinal -->
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="1"/><rect x="9" y="3" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
          <!-- wifi -->
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0 1 13 0"/><path d="M3.8 6.8a6.5 6.5 0 0 1 8.4 0"/><path d="M6.1 9.3a3 3 0 0 1 3.8 0"/><circle cx="8" cy="11" r=".9" fill="currentColor" stroke="none"/></svg>
          <!-- bateria -->
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".7" y=".7" width="20.6" height="10.6" rx="3" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="2.5" y="2.5" width="13" height="7" rx="1.6" fill="currentColor"/><path d="M23.2 4v4a2.2 2.2 0 0 0 0-4Z" fill="currentColor" opacity=".5"/></svg>
        </span>
      </div>

      <!-- Visor -->
      <section class="display">
        <div class="display-top">
          <button class="icon-btn" id="historyBtn" aria-label="Abrir histórico" aria-expanded="false" title="Histórico">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7v5l3.5 2"/></svg>
          </button>
          <div class="expr-wrap"><span id="expr"></span></div>
        </div>
        <div class="display-main" id="main" role="status" aria-live="polite">0</div>
      </section>

      <!-- Teclado -->
      <section class="keys" id="keys" aria-label="Teclado numérico">
        <button type="button" class="key fn clear" data-k="c" aria-label="Limpar tudo">AC</button>
        <button type="button" class="key fn" data-k="back" aria-label="Apagar último dígito">⌫</button>
        <button type="button" class="key fn" data-k="pct" aria-label="Porcentagem">%</button>
        <button type="button" class="key op" data-k="/" aria-label="Dividir">÷</button>

        <button type="button" class="key num" data-k="7">7</button>
        <button type="button" class="key num" data-k="8">8</button>
        <button type="button" class="key num" data-k="9">9</button>
        <button type="button" class="key op" data-k="*" aria-label="Multiplicar">×</button>

        <button type="button" class="key num" data-k="4">4</button>
        <button type="button" class="key num" data-k="5">5</button>
        <button type="button" class="key num" data-k="6">6</button>
        <button type="button" class="key op" data-k="-" aria-label="Subtrair">−</button>

        <button type="button" class="key num" data-k="1">1</button>
        <button type="button" class="key num" data-k="2">2</button>
        <button type="button" class="key num" data-k="3">3</button>
        <button type="button" class="key op" data-k="+" aria-label="Somar">+</button>

        <button type="button" class="key fn" data-k="neg" aria-label="Inverter sinal">±</button>
        <button type="button" class="key num" data-k="0">0</button>
        <button type="button" class="key num" data-k="." aria-label="Vírgula">,</button>
        <button type="button" class="key eq" data-k="=" aria-label="Igual">=</button>
      </section>

      <!-- Painel de histórico -->
      <div class="history-panel" id="historyPanel" role="dialog" aria-label="Histórico de cálculos">
        <div class="history-head">
          <h2>Histórico</h2>
          <button class="icon-btn" id="historyClear" aria-label="Limpar histórico" title="Limpar histórico">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
          <button class="icon-btn" id="historyClose" aria-label="Fechar histórico" title="Fechar">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
          </button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>

    </main>

    <p class="hint">
      <kbd>0–9</kbd> números &nbsp;·&nbsp; <kbd>+ − * /</kbd> operadores &nbsp;·&nbsp; <kbd>Enter</kbd> = &nbsp;·&nbsp;
      <kbd>Backspace</kbd> ⌫ &nbsp;·&nbsp; <kbd>Esc</kbd> AC &nbsp;·&nbsp; <kbd>%</kbd> percentual &nbsp;·&nbsp; <kbd>F9</kbd> ±
    </p>
  </div>

<script>
'use strict';

/* ============ NÚCLEO (puro, sem DOM) ============ */
/*CORE-START*/
const OPS = { '+':(a,b)=>a+b, '-':(a,b)=>a-b, '*':(a,b)=>a*b, '/':(a,b)=>a/b };
const PREC = { '+':1, '-':1, '*':2, '/':2 };
const OP_SYMBOL = { '+':'+', '-':'−', '*':'×', '/':'÷' };

const isOp  = t => typeof t === 'string' && Object.prototype.hasOwnProperty.call(PREC, t);
const isNum = t => typeof t === 'string' && !isOp(t) && t.length > 0;

function trimNum(n){
  if(typeof n !== 'number' || !isFinite(n)) return '0';
  return String(parseFloat(n.toPrecision(12)));
}

/* Formata um número "cru" digitado (ex.: '-12345.6%') para exibição pt-BR ('−12.345,6%') */
function fmtRaw(raw){
  let pct = false;
  if(raw.endsWith('%')){ pct = true; raw = raw.slice(0, -1); }
  const parts = raw.split('.');
  let int = parts[0], dec = parts[1];
  let neg = int.startsWith('-');
  if(neg) int = int.slice(1) || '0';
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  let out = (neg ? '−' : '') + int + (dec != null ? ',' + dec : '');
  return out + (pct ? '%' : '');
}

/* Formata um número calculado para exibição */
function fmtNum(n){
  if(typeof n !== 'number' || !isFinite(n)) return 'Erro';
  const r = parseFloat(n.toPrecision(12));
  if(r === 0) return '0';
  if(Math.abs(r) >= 1e15 || Math.abs(r) < 1e-9){
    const [m, e] = r.toExponential(6).split('e');
    return (m.replace(/\.?0+$/, '').replace('.', ',') + 'e' + e).replace(/-/g, '−');
  }
  return r.toLocaleString('pt-BR', { maximumFractionDigits: 10 }).replace(/-/g, '−');
}

/* Converte tokens com '%' em números: A+B% -> A+(A·B/100); A×B% -> A·(B/100) */
function resolvePercents(toks){
  const out = [];
  for(const t of toks){
    if(isNum(t) && t.endsWith('%')){
      const v = parseFloat(t);
      let base = null;
      if(out.length >= 2){
        const op = out[out.length - 1], a = out[out.length - 2];
        if(isOp(op) && (op === '+' || op === '-') && isNum(a)) base = parseFloat(a);
      }
      out.push(base != null ? base * v / 100 : v / 100);
    } else {
      out.push(t);
    }
  }
  return out;
}

/* Avalia a expressão com precedência (shunting-yard) */
function evalTokens(toks){
  const t = resolvePercents(toks);
  const out = [], ops = [];
  for(const x of t){
    if(isOp(x)){
      while(ops.length && PREC[ops[ops.length - 1]] >= PREC[x]) out.push(ops.pop());
      ops.push(x);
    } else {
      out.push(parseFloat(x));
    }
  }
  while(ops.length) out.push(ops.pop());
  const st = [];
  for(const x of out){
    if(typeof x === 'number'){ st.push(x); continue; }
    const b = st.pop(), a = st.pop();
    if(a == null || b == null) throw new Error('SYNTAX');
    if(x === '/' && b === 0) throw new Error('DIV0');
    st.push(OPS[x](a, b));
  }
  if(st.length !== 1 || typeof st[0] !== 'number' || !isFinite(st[0])) throw new Error('SYNTAX');
  return st[0];
}
/*CORE-END*/

/* ============ ESTADO ============ */
let tokens = [];          // ex.: ['12','+','10%']  (números crus com '.', operadores ASCII)
let entry = null;         // número sendo digitado agora (string crua) ou null
let resultNum = 0;        // último resultado
let justEvaluated = false;
let error = null;
let lastExpr = '';        // expressão mostrada após "="
let lastCalc = null;      // {op, b} para repetir "="
let history = [];

try{
  const saved = JSON.parse(localStorage.getItem('calc-history') || '[]');
  if(Array.isArray(saved)) history = saved.filter(h => h && typeof h.expr === 'string');
}catch(e){ /* storage indisponível */ }

function saveHistory(){
  try{ localStorage.setItem('calc-history', JSON.stringify(history)); }catch(e){}
}

/* ============ AÇÕES ============ */
function clearAll(){
  tokens = []; entry = null; resultNum = 0;
  justEvaluated = false; error = null; lastExpr = ''; lastCalc = null;
}

function freshAfterResult(){
  tokens = []; entry = null; justEvaluated = false; lastExpr = ''; lastCalc = null;
}

function pressDigit(d){
  if(error) clearAll();
  if(justEvaluated) freshAfterResult();
  if(entry === null) entry = '';
  const digitsOnly = entry.replace(/[-.%]/g, '');
  if(digitsOnly.length >= 12 || entry.length >= 15) return;
  if(d === '.'){
    if(entry.includes('.') || entry.includes('%')) return;
    entry = (entry === '' || entry === '-') ? entry + '0.' : entry + '.';
  } else {
    if(entry === '0') entry = d;
    else if(entry === '-0') entry = '-' + d;
    else entry += d;
  }
}

function pressOp(op){
  if(error) clearAll();
  if(justEvaluated){ tokens = [trimNum(resultNum)]; freshAfterResult(); tokens = [trimNum(resultNum)]; }
  if(entry !== null){ tokens.push(entry); entry = null; }
  if(tokens.length === 0){ tokens = ['0', op]; return; }
  const last = tokens[tokens.length - 1];
  if(isNum(last)) tokens.push(op);
  else tokens[tokens.length - 1] = op;   // troca o operador
}

function pressPct(){
  if(error) clearAll();
  if(justEvaluated){ entry = trimNum(resultNum); freshAfterResult(); tokens = []; }
  if(entry !== null){
    if(entry.includes('%')) return;
    entry += '%';
  } else {
    const i = tokens.length - 1;
    if(i >= 0 && isNum(tokens[i]) && !tokens[i].includes('%')) tokens[i] += '%';
  }
}

function negate(s){
  return s.startsWith('-') ? s.slice(1) : '-' + s;
}

function pressNeg(){
  if(error) clearAll();
  if(justEvaluated){ entry = negate(trimNum(resultNum)); freshAfterResult(); tokens = []; return; }
  if(entry !== null){
    if(entry.includes('%')) return;
    entry = negate(entry);
  } else {
    const i = tokens.length - 1;
    if(i >= 0 && isNum(tokens[i]) && !tokens[i].includes('%')) tokens[i] = negate(tokens[i]);
    else entry = '-0';   // início de expressão ou logo após operador → número negativo
  }
}

function pressEquals(){
  if(error){ clearAll(); return; }
  if(justEvaluated){
    if(!lastCalc) return;
    tokens = [trimNum(resultNum), lastCalc.op, lastCalc.b];  // repete a última operação
  } else {
    if(entry !== null){ tokens.push(entry); entry = null; }
    if(tokens.length === 0) return;
    if(isOp(tokens[tokens.length - 1])) tokens.pop();
    if(tokens.length === 0) return;
  }
  try{
    const display = tokensDisplay();
    const v = evalTokens(tokens);
    lastCalc = tokens.length >= 3
      ? { op: tokens[tokens.length - 2], b: trimNum(parseFloat(tokens[tokens.length - 1])) }
      : null;
    resultNum = v;
    justEvaluated = true;
    lastExpr = display + ' =';
    history.unshift({ expr: display, result: fmtNum(v), raw: trimNum(v) });
    if(history.length > 40) history.length = 40;
    saveHistory();
    renderHistory();
  }catch(e){
    error = e.message === 'DIV0' ? 'Não é possível dividir por zero' : 'Erro de expressão';
  }
}

function pressBack(){
  if(error){ clearAll(); return; }
  if(justEvaluated){
    const s = trimNum(resultNum);
    freshAfterResult(); resultNum = 0;
    entry = s.slice(0, -1);
    if(entry === '' || entry === '-') entry = null;
    return;
  }
  if(entry !== null){
    entry = entry.slice(0, -1);
    if(entry === '' || entry === '-') entry = null;
    return;
  }
  const last = tokens[tokens.length - 1];
  if(last === undefined) return;
  if(isOp(last)){ tokens.pop(); return; }
  tokens.pop();
  const cut = last.replace('%', '').slice(0, -1);
  if(cut !== '' && cut !== '-') entry = cut;
}

/* ============ EXIBIÇÃO ============ */
function tokensDisplay(){
  const parts = tokens.map(t => isOp(t) ? OP_SYMBOL[t] : fmtRaw(t));
  if(entry !== null) parts.push(fmtRaw(entry));
  return parts.join('');
}

function lastNumberToken(){
  if(entry !== null) return entry;
  for(let i = tokens.length - 1; i >= 0; i--){
    if(isNum(tokens[i])) return tokens[i];
  }
  return null;
}

function escapeTxt(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const exprEl = document.getElementById('expr');
const mainEl = document.getElementById('main');

function fitDisplay(){
  if(error){ mainEl.style.fontSize = ''; return; }
  const len = mainEl.textContent.length;
  mainEl.style.fontSize =
    len >= 15 ? '1.55rem' :
    len >= 12 ? '1.95rem' :
    len >= 10 ? '2.45rem' :
    len >= 8  ? '2.9rem'  : '';
}

function render(){
  let preview = null;
  const full = entry !== null ? [...tokens, entry] : [...tokens];
  if(!error && !justEvaluated && full.length >= 3){
    try{ preview = fmtNum(evalTokens(full)); }catch(e){ /* sem prévia */ }
  }

  if(justEvaluated){
    exprEl.innerHTML = escapeTxt(lastExpr);
  } else {
    exprEl.innerHTML = escapeTxt(tokensDisplay()) +
      (preview != null ? ' <span class="preview">= ' + escapeTxt(preview) + '</span>' : '');
  }

  if(error){
    mainEl.textContent = error;
    mainEl.classList.add('error');
  } else {
    mainEl.classList.remove('error');
    const ln = lastNumberToken();
    let txt;
    if(justEvaluated) txt = fmtNum(resultNum);
    else if(ln !== null) txt = fmtRaw(ln);
    else txt = '0';
    mainEl.textContent = txt;
  }
  fitDisplay();
}

/* ============ HISTÓRICO ============ */
const historyPanel = document.getElementById('historyPanel');
const historyList  = document.getElementById('historyList');
const historyBtn   = document.getElementById('historyBtn');

function renderHistory(){
  historyList.innerHTML = '';
  if(history.length === 0){
    const p = document.createElement('p');
    p.className = 'h-empty';
    p.innerHTML = 'Nenhum cálculo ainda.<br>Seu histórico aparece aqui.';
    historyList.appendChild(p);
    return;
  }
  for(const h of history){
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'h-item';
    const e1 = document.createElement('span');
    e1.className = 'h-expr';
    e1.textContent = h.expr + ' =';
    const e2 = document.createElement('span');
    e2.className = 'h-res';
    e2.textContent = h.result;
    item.append(e1, e2);
    item.addEventListener('click', () => {
      clearAll();
      entry = h.raw != null ? h.raw : trimNum(parseFloat(h.result.replace(/\./g, '').replace(',', '.')));
      closeHistory();
      render();
    });
    historyList.appendChild(item);
  }
}

function openHistory(){
  renderHistory();
  historyPanel.classList.add('open');
  historyBtn.setAttribute('aria-expanded', 'true');
}
function closeHistory(){
  historyPanel.classList.remove('open');
  historyBtn.setAttribute('aria-expanded', 'false');
}

historyBtn.addEventListener('click', openHistory);
document.getElementById('historyClose').addEventListener('click', closeHistory);
document.getElementById('historyClear').addEventListener('click', () => {
  history = [];
  saveHistory();
  renderHistory();
});

/* ============ ENTRADA ============ */
function buzz(){
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
}

function handle(k){
  buzz();
  if(k === 'c') clearAll();
  else if(k === 'back') pressBack();
  else if(k === '=') pressEquals();
  else if(k === 'pct') pressPct();
  else if(k === 'neg') pressNeg();
  else if(k === '+' || k === '-' || k === '*' || k === '/') pressOp(k);
  else pressDigit(k);
  render();
}

document.getElementById('keys').addEventListener('click', ev => {
  const b = ev.target.closest('button.key');
  if(!b) return;
  handle(b.dataset.k);
});

function mapKey(key){
  if(/^[0-9]$/.test(key)) return key;
  if(key === ',' || key === '.') return '.';
  if(key === '+' || key === '-' || key === '/' || key === '*' || key === 'x' || key === 'X') return key === 'x' || key === 'X' ? '*' : key;
  if(key === 'Enter' || key === '=') return '=';
  if(key === 'Backspace') return 'back';
  if(key === 'Escape' || key === 'Delete' || key === 'c' || key === 'C') return 'c';
  if(key === '%') return 'pct';
  if(key === 'F9') return 'neg';
  return null;
}

document.addEventListener('keydown', ev => {
  if(ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = mapKey(ev.key);
  if(k === null) return;
  ev.preventDefault();
  const btn = document.querySelector('.key[data-k="' + CSS.escape(k) + '"]');
  if(btn){
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 130);
  }
  handle(k);
});

/* ============ RELÓGIO ============ */
const clockEl = document.getElementById('clock');
function tick(){
  try{
    clockEl.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }catch(e){
    const d = new Date();
    clockEl.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
}
tick();
setInterval(tick, 15000);

/* ============ INÍCIO ============ */
render();
</script>
